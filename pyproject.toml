[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text-transfer-studio"
version = "0.3.0"
description = "Local OCR, non-destructive A/B text typesetting and workspace-scoped MCP tools"
readme = "README.txt"
requires-python = ">=3.11,<3.14"
dependencies = [
    "Pillow==12.3.0", "rapidocr==3.10.0", "onnxruntime==1.29.0",
    "opencv-python-headless==4.10.0.84", "numpy==2.4.6", "fonttools==4.61.1",
    "requests==2.34.2", "jsonschema>=4.23,<5"
]

[project.scripts]
textshift-mcp = "textshift_studio.mcp_server:main"

[project.gui-scripts]
textshift = "textshift_studio.app:main"

[tool.setuptools]
packages = ["textshift_studio"]
include-package-data = false

[tool.setuptools.package-dir]
textshift_studio = "."
